<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom Builder — Theme Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Oswald:wght@500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e8e0cf;font-family:Inter,system-ui,sans-serif;padding:26px 14px 50px;color:#2E2118}
  h1{font-family:Oswald,sans-serif;font-size:22px;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-bottom:6px}
  .sub{text-align:center;font-size:13px;color:#6b5f4c;margin-bottom:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;max-width:1080px;margin:0 auto}
  .tcard{background:#fffdf8;border:1px solid #d8cbae;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .tname{font-family:Oswald,sans-serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
  .tdesc{font-size:12px;color:#6b5f4c;line-height:1.5;margin-top:-8px}
  .tphone{border-radius:16px;overflow:hidden;background:var(--bg);color:var(--ink);border:1px solid var(--line);display:flex;flex-direction:column;min-height:300px}
  .t-mast{background:var(--wine);color:#fff;padding:12px 14px;font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.22em}
  .t-body{padding:14px;flex:1;display:flex;flex-direction:column;gap:8px}
  .t-hero{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px}
  .t-hero span{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .t-hero b{display:block;font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:700;margin-top:2px}
  .t-row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
  .t-row b{font-family:Fraunces,Georgia,serif;font-size:15px}
  .t-tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding:9px 4px 12px}
  .t-tabs i{flex:1;height:8px;border-radius:99px;background:var(--line);margin:0 5px}
  .t-tabs i.on{background:var(--wine)}
  .pick{border:0;border-radius:10px;background:#2E2118;color:#fff;padding:.7rem;font-weight:700;font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<h1>Theme Catalog</h1>
<p class="sub">Ten looks for Kingdom Builder. Tell me the name of the one you love and I'll put it in the app.</p>
<div class="grid" id="grid"></div>
<script>
const THEMES = [
  { id:"editorial", name:"Editorial Wine", desc:"Your brand at full strength. Wine, cream, gold.",
    v:{bg:"#F8F1E5",ink:"#2E2118",muted:"#7d7160",line:"#e3d6bd",card:"#FFFDF8",wine:"#5E1F2E",gold:"#C9A24B"} },
  { id:"dark-luxe", name:"Dark Luxe", desc:"Dark-first and premium. Espresso black, glowing gold.",
    v:{bg:"#170f0d",ink:"#F3EAD8",muted:"#a89880",line:"#3a2a22",card:"#1f1411",wine:"#a05064",gold:"#C9A24B"} },
  { id:"warm-minimal", name:"Warm Minimal", desc:"Almost nothing there. Calm, spacious, quiet.",
    v:{bg:"#FBF8F1",ink:"#292019",muted:"#8a7c68",line:"#ece3d0",card:"#ffffff",wine:"#5E1F2E",gold:"#C9A24B"} },
  { id:"classic", name:"Classic", desc:"The original green and cream the app was born with.",
    v:{bg:"#f7f4ee",ink:"#221f1b",muted:"#6f665b",line:"#ddd3c4",card:"#fffdf9",wine:"#2f6f4e",gold:"#b7861f"} },
  { id:"midnight", name:"Midnight", desc:"Deep navy night sky with warm gold stars.",
    v:{bg:"#141c2a",ink:"#eef1f6",muted:"#8b96ab",line:"#2a3547",card:"#1c2536",wine:"#4a6fa5",gold:"#d4a94e"} },
  { id:"forest", name:"Forest", desc:"Deep green, cream, sage. Money grows here.",
    v:{bg:"#f2f5ee",ink:"#1c2b1e",muted:"#67755f",line:"#d9e0d0",card:"#fdfff9",wine:"#1e3a2a",gold:"#a8a04e"} },
  { id:"blush", name:"Blush", desc:"Soft rose morning. Gentle, warm, feminine.",
    v:{bg:"#faf0ec",ink:"#4a2c28",muted:"#a08078",line:"#ecd8d0",card:"#fffaf7",wine:"#8e3b4a",gold:"#d49a6a"} },
  { id:"teal", name:"Deep Teal", desc:"Ocean depth with sandy shores and brass.",
    v:{bg:"#0f2b2b",ink:"#e8f0ec",muted:"#7fa39b",line:"#234545",card:"#162f2f",wine:"#2a7a6e",gold:"#c9a24B"} },
  { id:"cocoa", name:"Cocoa", desc:"Milk chocolate and cream. Cozy and rich.",
    v:{bg:"#f5efe6",ink:"#3a2a1e",muted:"#8a7560",line:"#e2d5c0",card:"#fffaf2",wine:"#6b4226",gold:"#c98f4e"} },
  { id:"slate", name:"Slate Blue", desc:"Soft stormy blue-gray. Calm and modern.",
    v:{bg:"#eef1f5",ink:"#232b3a",muted:"#75809a",line:"#d8dee8",card:"#ffffff",wine:"#3a4a6b",gold:"#b98f3e"} },
];
const grid = document.getElementById("grid");
grid.innerHTML = THEMES.map(t => `
  <div class="tcard">
    <div class="tname">${t.name}</div>
    <div class="tdesc">${t.desc}</div>
    <div class="tphone" style="--bg:${t.v.bg};--ink:${t.v.ink};--muted:${t.v.muted};--line:${t.v.line};--card:${t.v.card};--wine:${t.v.wine};--gold:${t.v.gold}">
      <div class="t-mast">KINGDOM BUILDER</div>
      <div class="t-body">
        <div class="t-hero"><span>Safe to spend</span><b>$1,240</b></div>
        <div class="t-row"><span>Must protect</span><b>$2,310</b></div>
        <div class="t-row"><span>Bills still due</span><b>$267</b></div>
        <div class="t-row"><span>Paid this month</span><b>$6,014</b></div>
      </div>
      <div class="t-tabs"><i class="on"></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>`).join("");
</script>
</body>
</html>
